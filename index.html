/* التخطيط: ترويسة ليلية ← هرم بلوم لاصق ← عمود بطاقات واحد بعرض 760px */
:root{
  --bg:#F6F4EE; --card:#FFFFFF; --ink:#15202B; --muted:#5A6672; --line:#E4DFD4;
  --track:#E8E3D8; --shade:#FBFAF6;
  --nav1:#0B2545; --nav2:#13315C; --nav3:#1B4965; --onnav:#EAF2FA; --onnav2:#A9C4DC;
  --ok:#047857; --okb:#DEF4EA; --bad:#BE123C; --badb:#FBE3E8;
  --l1:#0E7490; --l1b:#E0F2F7;
  --l2:#047857; --l2b:#DEF4EA;
  --l3:#B45309; --l3b:#FBEDDC;
  --l4:#6D28D9; --l4b:#EEE7FC;
  --l5:#BE123C; --l5b:#FBE3E8;
  --l6:#1D4ED8; --l6b:#E3EAFD;
  --ff-d:Calibri,Arial,"Segoe UI",system-ui,sans-serif;
  --ff-b:Arial,Calibri,"Segoe UI",system-ui,sans-serif;
  --r:16px;
  --trackh:66px; --secnavh:58px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#121821; --card:#1B232F; --ink:#E8EDF3; --muted:#9DAFBF; --line:#2B3542;
  --track:#273140; --shade:#161E29;
  --ok:#34D399; --okb:#0C3A2C; --bad:#FB7185; --badb:#43121F;
  --l1:#22B8D6; --l1b:#0C333D;
  --l2:#34D399; --l2b:#0C3A2C;
  --l3:#F2A447; --l3b:#412A0E;
  --l4:#A78BFA; --l4b:#2C2047;
  --l5:#FB7185; --l5b:#43121F;
  --l6:#7CA0FF; --l6b:#16244A;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121821; --card:#1B232F; --ink:#E8EDF3; --muted:#9DAFBF; --line:#2B3542;
  --track:#273140; --shade:#161E29;
  --ok:#34D399; --okb:#0C3A2C; --bad:#FB7185; --badb:#43121F;
  --l1:#22B8D6; --l1b:#0C333D;
  --l2:#34D399; --l2b:#0C3A2C;
  --l3:#F2A447; --l3b:#412A0E;
  --l4:#A78BFA; --l4b:#2C2047;
  --l5:#FB7185; --l5b:#43121F;
  --l6:#7CA0FF; --l6b:#16244A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{direction:rtl;text-align:right;margin:0;background:var(--bg);color:var(--ink);font-family:var(--ff-b);font-size:16px;line-height:1.85;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--nav1)}
h1,h2,h3,.dsp{font-family:var(--ff-d);font-weight:700;line-height:1.5;text-wrap:balance}
button{font-family:inherit;font-size:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ===== الترويسة ===== */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#0B2545,#13315C 45%,#1B4965);color:var(--onnav)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.hero::before{width:420px;height:420px;top:-210px;right:-90px;background:radial-gradient(circle,rgba(125,211,252,.22),rgba(125,211,252,0) 68%);animation:drift 18s ease-in-out infinite alternate}
.hero::after{width:360px;height:360px;bottom:-200px;left:-70px;background:radial-gradient(circle,rgba(167,139,250,.20),rgba(167,139,250,0) 70%);animation:drift2 18s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-46px,34px)}}
@keyframes drift2{from{transform:translate(0,0)}to{transform:translate(40px,-30px)}}
.hero .wrap{position:relative;z-index:1;padding-block:34px 26px;max-width:1140px}
.eyebrow{font-size:.8rem;font-weight:700;letter-spacing:.09em;color:var(--onnav2);margin:0 0 9px}
.byline{margin:0 0 11px;font-size:.88rem;color:var(--onnav2)}
.byline b{color:#fff;font-weight:700}
.byline span{opacity:.7;font-size:.8rem;margin-inline-start:6px;letter-spacing:.03em}
.pagefoot{margin-top:8px;padding-block:22px;background:var(--nav1);color:var(--onnav2);text-align:center}
.pagefoot .wrap{max-width:1140px}
.pagefoot .fname{margin:0;font-family:var(--ff-d);font-size:1.05rem;color:#fff}
.pagefoot .fname b{font-weight:700}
.pagefoot .fmeta{margin:6px 0 0;font-size:.82rem;line-height:1.8}
.hero h1{margin:0;font-size:clamp(1.9rem,6vw,3.1rem);line-height:1.32;letter-spacing:-.015em;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.22)}
.lede{margin:9px 0 0;color:var(--onnav2);font-size:clamp(.95rem,2.3vw,1.08rem);font-weight:500}
.quote{margin:20px 0 0;max-width:68ch;padding:13px 17px;border-right:3px solid #7DD3FC;
  background:rgba(255,255,255,.06);border-radius:0 13px 13px 0;font-size:clamp(.92rem,2.2vw,1rem);line-height:1.95;color:#E6EEF7}
.quote cite{display:block;margin-top:6px;font-style:normal;font-weight:700;font-size:.85rem;color:var(--onnav2)}
.hcard{display:flex;flex-wrap:wrap;align-items:center;gap:20px;margin-top:22px;padding:16px 20px;

.scorebox{flex:none;display:flex;align-items:baseline;gap:10px}
.scorebox .lbl{font-size:.85rem;font-weight:700;color:var(--onnav2)}
.scorebox .num{font-family:var(--ff-d);font-size:clamp(2.7rem,9vw,3.5rem);font-weight:700;color:#fff;line-height:1}
.scorebox .of{font-size:1rem;font-weight:700;color:var(--onnav2)}
.hmeta{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:11px}
.hline{margin:0;display:flex;flex-wrap:wrap;gap:9px;align-items:center;font-size:.89rem;font-weight:500;color:var(--onnav2)}
.hline .dot{opacity:.5}
.hline .tgl{margin-inline-start:auto}
.prog{flex:none;width:100%;height:12px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden}
.prog>i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(to left,#7DD3FC,#A7F3D0);transition:width .5s cubic-bezier(.3,1,.4,1)}

.topbars{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;box-shadow:0 4px 18px rgba(0,0,0,.22)}
.tracknav{background:var(--nav2);border-bottom:1px solid rgba(255,255,255,.14)}

.tracks{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none}

.tbtn{flex:1 1 170px;min-width:150px;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"st sc" "nm nm" "ar ar";
  gap:1px 8px;align-items:center;min-height:62px;padding:7px 13px;border-radius:14px;cursor:pointer;
  background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.2);color:var(--onnav2);
  font-family:var(--ff-b);text-align:right;transition:background .18s,border-color .18s,color .18s,transform .18s}
.tbtn:hover{background:rgba(255,255,255,.16);color:#fff;transform:translateY(-1px)}
.tbtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.tbtn .stars{grid-area:st;font-size:.88rem;letter-spacing:1px;color:#FDE68A}
.tbtn .tsc{grid-area:sc;justify-self:start;font-size:.8rem;font-weight:700;opacity:.9}
.tbtn .tname{grid-area:nm;font-family:var(--ff-d);font-weight:700;font-size:1.02rem;letter-spacing:.04em}
.tbtn .tar{grid-area:ar;font-size:.78rem;opacity:.9}
.tbtn.cur{background:#fff;color:var(--nav1);border-color:#fff;box-shadow:0 3px 12px rgba(0,0,0,.18)}
.tbtn.cur .stars{color:#B45309}
.secnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--trackh));z-index:24;
  background:var(--nav1);border-bottom:1px solid rgba(255,255,255,.13);box-shadow:0 3px 14px rgba(0,0,0,.18)}
.secnav .wrap{max-width:1340px;padding-block:8px}
.navhead{display:none;margin:0 0 9px;font-family:var(--ff-d);font-size:.88rem;color:var(--ink)}
.badges{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.badges::-webkit-scrollbar{display:none}
.bdg{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:5px 13px 5px 7px;
  border-radius:99px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.22);
  color:var(--onnav2);font-family:var(--ff-b);font-size:.87rem;font-weight:700;cursor:pointer;white-space:nowrap;
  transition:background .18s ease,border-color .18s ease,color .18s ease,transform .18s ease}
.bdg:hover{background:rgba(255,255,255,.17);color:#fff;transform:translateY(-1px)}
.bdg:focus-visible{outline:2px solid #fff;outline-offset:2px}

  background:rgba(255,255,255,.16);color:#fff;font-size:.74rem;font-weight:700}
.bdg .c{font-size:.76rem;font-weight:500;opacity:.85}
.bdg .m{font-size:.9rem}
.bdg.cur{background:#fff;color:var(--nav1);border-color:#fff}
.bdg.cur .i{background:var(--nav2);color:#fff}
.bdg.on{border-color:#FDE68A;color:#FDE68A}
.bdg.on .i{background:#FDE68A;color:#4A3200}
.bdg.on.cur{background:#FDE68A;color:#4A3200;border-color:#FDE68A}
.bdg.on.cur .i{background:#4A3200;color:#FDE68A}

/* ===== هرم بلوم ===== */
.shell{display:block}
.pyr{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--trackh) + var(--secnavh));z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.pyr .wrap{padding-block:10px}
.sidescore{display:none;flex-wrap:wrap;margin:10px 0 0;align-items:baseline;gap:5px}
.sidescore .num{font-family:var(--ff-d);font-size:1.9rem;font-weight:700;color:var(--ink)}
.sidescore span+span{font-size:.9rem;color:var(--muted);font-weight:700;white-space:nowrap}
.sidescore em{flex:1 1 100%;font-style:normal;font-size:.78rem;color:var(--muted)}
.pyrhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pyrhead b{font-family:var(--ff-d);font-size:.9rem}
.pyrhead button{display:none;min-height:36px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:.8rem}
.layers{display:flex;flex-direction:column;align-items:center;gap:3px;margin-top:8px}
.ly{width:var(--w);max-width:100%;height:24px;border:1px solid transparent;border-radius:7px;
  background:linear-gradient(to left,var(--c) 0 var(--p),var(--track) var(--p) 100%);
  display:flex;align-items:center;justify-content:space-between;padding:0 10px;
  font-family:inherit;font-size:.74rem;font-weight:700;color:var(--ink);cursor:pointer;
  transition:background .5s ease,transform .15s ease,border-color .15s ease}
.ly:hover{border-color:var(--c);transform:scale(1.02)}
.ly:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.ly:active{transform:scale(.99)}
.pyrhint{margin:7px 0 0;font-size:.74rem;color:var(--muted);text-align:center}
.ly span{text-shadow:0 0 6px var(--bg)}
@media (max-width:719px){
  .pyr{position:static}
  .pyrhead button{display:inline-block}
  .layers.hide{display:none}
  .ly{height:20px;font-size:.68rem}
}
/* شاشات واسعة: الهرم عمودٌ جانبيٌّ ثابتٌ يرافق الطالب حتى آخر سؤال */

  /* عمودان جانبيان: الأقسام يميناً والهرم يساراً، والأسئلة بينهما */
  .shell{max-width:1340px;margin:0 auto;display:grid;gap:22px;align-items:start;
    grid-template-columns:228px minmax(0,1fr) 278px;grid-template-areas:"nav main pyr";
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  main{grid-area:main;min-width:0}
  .shell .sec,.shell .card{scroll-margin-top:calc(env(safe-area-inset-top,0px) + var(--trackh) + 14px)}

  .secnav{grid-area:nav;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--trackh) + 18px);
    margin-top:26px;background:var(--card);border:1px solid var(--line);border-bottom:1px solid var(--line);
    border-radius:18px;box-shadow:0 6px 20px rgba(11,37,69,.06)}
  .secnav .wrap{max-width:none;padding-block:14px;padding-left:14px;padding-right:14px}
  .navhead{display:block}
  .badges{flex-direction:column;gap:7px;overflow:visible}
  .bdg{width:100%;justify-content:flex-start;min-height:46px;padding:5px 12px 5px 8px;
    background:var(--bg);border-color:var(--line);color:var(--ink);white-space:normal;text-align:right}
  .bdg>span:nth-child(3){flex:1 1 auto;min-width:0}
  .bdg .i{background:var(--shade);color:var(--muted);border:1px solid var(--line)}
  .bdg .c{color:var(--muted)}
  .bdg:hover{background:var(--shade);color:var(--ink)}
  .bdg:focus-visible{outline-color:var(--nav2)}
  .bdg.cur{background:var(--nav2);color:#fff;border-color:var(--nav2)}
  .bdg.cur .i{background:#fff;color:var(--nav2);border-color:#fff}
  .bdg.cur .c{color:rgba(255,255,255,.85)}
  .bdg.on{border-color:#B45309;color:#B45309}
  .bdg.on .i{background:#FDE68A;color:#4A3200;border-color:#FDE68A}
  .bdg.on.cur{background:#B45309;color:#fff;border-color:#B45309}

  .pyr{grid-area:pyr;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--trackh) + 18px);
    background:var(--card);border:1px solid var(--line);border-bottom:1px solid var(--line);
    border-radius:18px;box-shadow:0 6px 20px rgba(11,37,69,.06);margin-top:26px}
  .pyr .wrap{max-width:none;padding-block:14px;padding-left:16px;padding-right:16px}
  .pyrhead b{font-size:.95rem}
  .sidescore{display:flex}
  .layers{margin-top:12px;gap:4px}
  .ly{height:28px;font-size:.78rem}
  main .wrap{max-width:none;margin:0;padding-left:0;padding-right:0}
  main .wrap{padding-block:0 44px}
    .byline{margin:0 0 11px;font-size:.88rem;color:var(--onnav2)}
.byline b{color:#fff;font-weight:700}
.byline span{opacity:.7;font-size:.8rem;margin-inline-start:6px;letter-spacing:.03em}
.pagefoot{margin-top:8px;padding-block:22px;background:var(--nav1);color:var(--onnav2);text-align:center}
.pagefoot .wrap{max-width:1140px}
.pagefoot .fname{margin:0;font-family:var(--ff-d);font-size:1.05rem;color:#fff}
.pagefoot .fname b{font-weight:700}
.pagefoot .fmeta{margin:6px 0 0;font-size:.82rem;line-height:1.8}
.hero h1{font-size:2.5rem}

}

/* ===== الأقسام ===== */
main .wrap{padding-block:8px 40px}
.sec{margin-top:34px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + var(--trackh) + var(--secnavh) + 14px)}
.sechead{position:relative;padding:8px 14px 8px 8px;border-right:5px solid var(--sc,var(--l1));overflow:hidden}
.sechead .wm{position:absolute;left:4px;top:-8px;font-family:var(--ff-d);font-weight:700;font-size:4.4rem;opacity:.07;line-height:1;pointer-events:none}
.sechead h2{margin:0;font-size:clamp(1.22rem,3.4vw,1.5rem)}
.sechead p{margin:3px 0 0;color:var(--muted);font-size:.9rem}

/* ===== البطاقات ===== */
.card{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px 16px 16px;margin-top:14px;transition:box-shadow .2s ease,transform .2s ease,border-color .2s ease}
.card::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--c);opacity:.65}
.card:hover{box-shadow:0 10px 28px rgba(11,37,69,.11);transform:translateY(-2px)}
.card:focus-within{border-color:var(--c)}
.card{scroll-margin-top:calc(env(safe-area-inset-top,0px) + var(--trackh) + var(--secnavh) + 14px)}
.card.show{animation:slidein .36s cubic-bezier(.22,1,.36,1) both}
@keyframes slidein{from{opacity:0;transform:translateX(var(--dx,36px)) scale(.985)}to{opacity:1;transform:none}}
.card.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--c)}18%{box-shadow:0 0 0 5px var(--cb)}100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}}
.card.in{opacity:1;transform:none;transition:opacity .45s ease,transform .45s ease}
.chead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qn{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 7px;border-radius:9px;background:var(--shade);border:1px solid var(--line);font-weight:700;font-size:.82rem}
.lvl{display:inline-block;padding:3px 13px;border-radius:99px;font-size:.8rem;font-weight:700;background:var(--cb);color:var(--c)}
.clock{margin-inline-start:auto;padding:3px 11px;border-radius:99px;background:var(--shade);
  border:1px solid var(--line);color:var(--muted);font-size:.8rem;font-weight:700;white-space:nowrap}
.fbtime{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);font-size:.84rem;color:var(--muted)}
.steptime{margin-inline-start:8px;font-weight:700;color:var(--muted)}
.times{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.times>b{font-family:var(--ff-d);font-size:.92rem}
.ttot{margin:7px 0 12px;font-size:.88rem;color:var(--muted);line-height:1.9}
.ttot .num{color:var(--ink);font-weight:700}
.trow{margin-top:10px}
.tlab{margin:0 0 5px;font-size:.84rem;font-weight:700}
.tlab .num{color:var(--muted);font-weight:500;margin-inline-start:5px}
.tcells{display:flex;flex-wrap:wrap;gap:6px}
.tcell{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:9px;
  border:1px solid var(--line);background:var(--bg);font-size:.78rem}
.tcell b{color:var(--muted);font-weight:700}
.tcell.hot{border-color:var(--l3);background:var(--l3b);color:var(--l3)}
.tcell.hot b{color:var(--l3)}
.tcell.zero{opacity:.45}
.tspill em{font-style:normal;color:var(--muted);font-size:.8rem}
.qtext{margin:11px 0 0;font-weight:600;font-size:clamp(1.1rem,2.7vw,1.3rem);line-height:1.85;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;min-height:48px;text-align:right;font-size:1.06rem;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt .k{flex:none;width:27px;height:27px;border-radius:50%;background:var(--shade);border:1px solid var(--line);display:grid;place-items:center;font-size:.76rem;font-weight:700}
.opt.sel{border-color:var(--c);background:var(--cb)}
.opt.sel .k{background:var(--c);color:#fff;border-color:var(--c)}
.opt.good{border-color:var(--ok);background:var(--okb)}
.opt.bad{border-color:var(--bad);background:var(--badb)}
.opt:disabled{cursor:default;opacity:1}
.tfrow{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.tfrow .opt{flex:1 1 130px;justify-content:center;font-weight:700}
.sortg{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.srow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.srow .it{flex:1 1 150px;min-width:0;font-weight:600;font-size:1.02rem}
.srow .cats{display:flex;gap:6px;flex-wrap:wrap}
.cb{min-height:42px;padding:6px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-size:.95rem}
.cb:hover:not(:disabled){border-color:var(--c)}
.cb.sel{background:var(--c);color:#fff;border-color:var(--c)}
.cb.good{background:var(--okb);color:var(--ok);border-color:var(--ok)}
.cb.bad{background:var(--badb);color:var(--bad);border-color:var(--bad)}
textarea{width:100%;margin-top:12px;min-height:118px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit;font-size:1rem;line-height:1.8;resize:vertical}
textarea:focus{outline:2px solid var(--c);outline-offset:1px}
.wc{margin-top:6px;font-size:.78rem;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px}
.sub{min-height:44px;padding:8px 18px;border-radius:12px;border:none;background:var(--nav2);color:#fff;font-weight:700;cursor:pointer}
.sub:disabled{background:var(--track);color:var(--muted);cursor:not-allowed}
.sub.done{background:var(--shade);color:var(--muted);border:1px solid var(--line)}
.ver{min-height:44px;padding:8px 16px;border-radius:99px;border:2px solid var(--c);background:var(--card);color:var(--c);font-weight:700;cursor:pointer;animation:pop .25s ease-out, pulse 1.3s ease-in-out 2}
@keyframes pop{from{transform:scale(.85);opacity:.2}to{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(19,49,92,0)}50%{box-shadow:0 0 0 7px rgba(19,49,92,.14)}}
.vtag{font-size:.8rem;font-weight:700;color:var(--ok)}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--shade);font-size:.94rem}
.fb.good{background:var(--okb);border-color:var(--ok)}
.fb.bad{background:var(--badb);border-color:var(--bad)}
.fb.part{background:var(--l3b);border-color:var(--l3)}
.fb b{font-family:var(--ff-d)}
.fb .model{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{padding:2px 10px;border-radius:99px;font-size:.78rem;border:1px solid var(--line);background:var(--card)}
.chip.y{border-color:var(--ok);color:var(--ok)}
.chip.n{border-color:var(--muted);color:var(--muted);opacity:.85}
.gradebox{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.donut{flex:none}
.donut text{font-family:var(--ff-d);font-weight:700;font-size:15px;fill:var(--ink)}
.scorebig{font-family:var(--ff-d);font-size:1.4rem;font-weight:700}
.ai{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:.9rem}
.ai .tag{display:inline-block;padding:1px 9px;border-radius:99px;background:var(--l6b);color:var(--l6);font-size:.74rem;font-weight:700}
.thumb{flex:none;width:92px;height:68px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--shade)}
.fig{margin:13px 0 0}
.fig img{display:block;width:100%;max-width:min(var(--fw,360px),100%);height:auto;border-radius:12px;border:1px solid var(--line);background:var(--shade)}
.fig figcaption{margin-top:6px;font-size:.78rem;color:var(--muted)}
.passage{background:var(--card);border:1px solid var(--line);border-right:5px solid var(--l3);border-radius:var(--r);padding:16px;margin-top:14px}
.passage h3{margin:0 0 8px;font-size:1.05rem}
.passage p{margin:0;font-size:1.08rem;line-height:1.95}
.passage .src{margin-top:8px;font-size:.78rem;color:var(--muted)}

/* ===== النتائج ===== */
.stepper{position:sticky;bottom:0;z-index:18;display:flex;align-items:center;gap:12px;margin-top:22px;
  padding:11px 14px calc(11px + env(safe-area-inset-bottom,0px));border-radius:18px 18px 0 0;
  background:var(--card);border:1px solid var(--line);border-bottom:none;box-shadow:0 -6px 22px rgba(11,37,69,.09)}
.stepbtn{flex:none;min-height:46px;padding:9px 17px;border-radius:13px;border:1.5px solid var(--line);
  background:var(--bg);color:var(--ink);font-family:var(--ff-b);font-size:.95rem;font-weight:700;cursor:pointer;
  transition:background .15s,border-color .15s,transform .15s}
.stepbtn:hover:not(:disabled){background:var(--shade);border-color:var(--nav2);transform:translateY(-1px)}
.stepbtn:disabled{opacity:.4;cursor:not-allowed}
.stepbtn.go{background:var(--nav2);border-color:var(--nav2);color:#fff}
.stepbtn.go:hover:not(:disabled){background:var(--nav1);border-color:var(--nav1);color:#fff}
.stepbtn.ready{animation:nudge 1.2s ease-in-out 2}
@keyframes nudge{0%,100%{box-shadow:0 0 0 0 rgba(19,49,92,0)}50%{box-shadow:0 0 0 6px rgba(19,49,92,.16)}}
.stepmid{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:center}
.stepnum{margin:0;font-family:var(--ff-d);font-size:.92rem;font-weight:700;white-space:nowrap}
.steptrack{width:100%;height:7px;border-radius:99px;background:var(--track);overflow:hidden}
.steptrack>i{display:block;height:100%;width:0;border-radius:99px;background:var(--nav2);transition:width .4s cubic-bezier(.3,1,.4,1)}
@media (max-width:420px){
  .stepbtn{padding:9px 12px;font-size:.88rem}
  .stepnum{font-size:.84rem}
}
.res{margin-top:36px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.res h2{margin:0 0 4px;font-size:1.15rem}
.pct{font-family:var(--ff-d);font-size:clamp(2.6rem,9vw,3.6rem);font-weight:700;line-height:1.1;margin:6px 0 0}
.pct small{font-size:.42em;font-weight:700;color:var(--muted);margin-inline-start:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin-top:14px}
.tile{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
.tile b{display:block;font-size:.82rem;color:var(--muted);font-weight:500}
.tile span{font-family:var(--ff-d);font-weight:700}
.tsum{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.tsum>b{font-family:var(--ff-d);font-size:.92rem}
.tsrow{display:flex;flex-wrap:wrap;gap:9px;margin-top:9px}
.tspill{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:99px;
  border:1px solid var(--line);background:var(--bg);font-size:.86rem}
.tspill i{font-style:normal;color:#B45309;letter-spacing:1px}
.tspill.cur{border-color:var(--nav2);background:var(--shade);font-weight:700}
.foot{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.ghost{min-height:44px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
#cf{position:fixed;inset:0;pointer-events:none;z-index:40}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .card.show{opacity:1;transform:none}
  .card.flash{animation:none;outline:2px solid var(--c)}
  .card.show{animation:none}
}
@media print{
  .hero,.pyr,.acts,.foot,#cf,.topbars,.secnav,.tgl,.stepper{display:none!important}
  .sec,.card,.res{display:block!important}
  .pagefoot{display:block!important;background:#fff;color:#000;border-top:1px solid #999;margin-top:16px}
  .pagefoot .fname{color:#000}
  .shell{display:block}
  body{background:#fff;color:#000}
  .card,.res,.thumb{flex:none;width:92px;height:68px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--shade)}
.fig{margin:13px 0 0}
.fig img{display:block;width:100%;max-width:min(var(--fw,360px),100%);height:auto;border-radius:12px;border:1px solid var(--line);background:var(--shade)}
.fig figcaption{margin-top:6px;font-size:.78rem;color:var(--muted)}
.passage{break-inside:avoid;page-break-inside:avoid;box-shadow:none}
}

/* ===================== الواجهات: اللوحة · الشرح · المصادر · التقرير · المعلّم ===================== */
.view[hidden]{display:none!important}
.d-wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* زرّ «لوحتي» وسطر الطالب في البوكلت */
.homebtn{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;min-width:46px;padding:6px 14px;
  border-radius:13px;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;
  font-family:var(--ff-b);font-size:.92rem;font-weight:700;cursor:pointer;transition:background .15s,transform .15s}
.homebtn:hover{background:rgba(255,255,255,.2);transform:translateY(-1px)}
.homebtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.tracknav .wrap{display:flex;gap:9px;align-items:stretch}
.tracknav .tracks{flex:1 1 auto;min-width:0}
.tracknav .homebtn{min-height:62px}
@media (max-width:560px){.homebtn span{display:none}.tracknav .homebtn{padding:6px 11px}}
.stuline{margin:12px 0 0;display:inline-flex;flex-wrap:wrap;gap:6px;padding:6px 14px;border-radius:99px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:.88rem;font-weight:700}
.tbtn.locked{opacity:.55;cursor:not-allowed;border-style:dashed}
.tbtn.locked:hover{transform:none;background:rgba(255,255,255,.07);color:var(--onnav2)}
.tbtn .tlk{font-style:normal;font-size:.85rem;margin-inline-start:4px}

/* ترويسة اللوحة */
.d-hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#0B2545,#13315C 45%,#1B4965);color:var(--onnav)}
.d-hero::before{content:"";position:absolute;width:440px;height:440px;top:-230px;right:-100px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(125,211,252,.22),rgba(125,211,252,0) 68%)}
.d-hero::after{content:"";position:absolute;width:360px;height:360px;bottom:-210px;left:-80px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(167,139,250,.2),rgba(167,139,250,0) 70%)}
.d-hero .d-wrap{position:relative;z-index:1;padding-block:34px 70px}
.d-ctx{margin:0 0 9px;font-size:.8rem;font-weight:700;letter-spacing:.06em;color:var(--onnav2)}
.d-by{margin:0 0 11px;font-size:.88rem;color:var(--onnav2)}
.d-by b{color:#fff}
.d-by span{opacity:.7;font-size:.8rem;margin-inline-start:6px}
.d-hero h1{margin:0;font-size:clamp(1.9rem,6vw,3rem);line-height:1.3;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.22)}
.d-lede{margin:10px 0 0;color:var(--onnav2);font-size:clamp(.98rem,2.4vw,1.1rem);max-width:60ch}
.d-main{position:relative;z-index:2;margin-top:-44px;padding-bottom:36px}

/* أزرار عامّة */
.d-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:9px 20px;border-radius:13px;
  border:1.5px solid var(--nav2);background:var(--nav2);color:#fff;font-family:var(--ff-b);font-size:.98rem;font-weight:700;cursor:pointer;
  text-decoration:none;transition:background .15s,border-color .15s,transform .15s}
.d-btn:hover:not(:disabled){background:var(--nav1);border-color:var(--nav1);transform:translateY(-1px)}
.d-btn:focus-visible{outline:2px solid var(--nav2);outline-offset:2px}
.d-btn:disabled{opacity:.5;cursor:not-allowed}
.d-btn.ghost2{background:var(--card);color:var(--ink);border-color:var(--line)}
.d-btn.ghost2:hover:not(:disabled){background:var(--shade);border-color:var(--nav2);color:var(--ink)}
.d-btn.sm{min-height:40px;padding:6px 14px;font-size:.88rem;border-radius:11px}
.d-btn.danger{background:var(--bad);border-color:var(--bad)}
.d-btn.armed,.t-mini.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.d-link{min-height:40px;padding:4px 10px;border:none;background:none;color:var(--l6);font-family:var(--ff-b);font-size:.9rem;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.d-link:hover{color:var(--nav1)}
.d-link.light{color:#fff}
.d-link.armed{color:var(--bad)}
.d-acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.d-err{margin:10px 0 0;padding:9px 13px;border-radius:11px;background:var(--badb);color:var(--bad);font-weight:700;font-size:.92rem}

/* التسجيل */
.d-panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px clamp(16px,4vw,30px);box-shadow:0 14px 40px rgba(11,37,69,.12)}
.d-panel h2{margin:4px 0 12px;font-size:clamp(1.25rem,3.4vw,1.5rem)}
.d-steps{list-style:none;display:flex;gap:8px;margin:0 0 14px;padding:0;flex-wrap:wrap}
.d-steps li{display:inline-flex;align-items:center;gap:7px;padding:5px 13px 5px 6px;border-radius:99px;background:var(--shade);border:1px solid var(--line);color:var(--muted);font-size:.86rem;font-weight:700}
.d-steps li b{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:var(--track);color:var(--muted);font-size:.78rem}
.d-steps li.on{color:var(--nav2);border-color:var(--nav2)}
.d-steps li.on b{background:var(--nav2);color:#fff}
.d-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.d-field label{display:block;margin-bottom:6px;font-weight:700;font-size:.95rem}
.d-field input,.t-grid input,.t-grid select,.t-pinrow input{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--bg);color:var(--ink);font-family:var(--ff-b);font-size:1.02rem}
.d-field input:focus,.t-grid input:focus,.t-grid select:focus,.t-pinrow input:focus{outline:2px solid var(--nav2);outline-offset:1px;border-color:var(--nav2)}
.d-note{margin:0 0 12px;padding:10px 14px;border-radius:12px;background:var(--l3b);color:var(--ink);font-size:.95rem;border-right:4px solid var(--l3)}
.d-levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.d-lev{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-height:150px;padding:16px;border-radius:16px;text-align:right;
  border:2px solid var(--line);background:var(--bg);font-family:var(--ff-b);cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s}
.d-lev:hover{border-color:var(--nav2);transform:translateY(-2px);box-shadow:0 8px 22px rgba(11,37,69,.1)}
.d-lev:focus-visible{outline:2px solid var(--nav2);outline-offset:2px}
.d-lev.sel{border-color:var(--nav2);background:var(--card);box-shadow:0 0 0 4px rgba(19,49,92,.13)}
.d-levst{color:#B45309;letter-spacing:1px;font-size:.92rem}
.d-levn{font-family:var(--ff-d);font-size:1.45rem;letter-spacing:.04em}
.d-leva{font-weight:700;color:var(--nav2)}
.d-levd{margin-top:4px;font-size:.88rem;color:var(--muted);line-height:1.7}
.d-confirm{margin-top:14px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--nav2);background:var(--shade);animation:pop .25s ease-out}
.d-confirm p{margin:0;line-height:1.9}

/* لوحة الطالب */
.d-stu{display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px;background:var(--card);border:1px solid var(--line);border-radius:22px;
  padding:18px 20px;box-shadow:0 14px 40px rgba(11,37,69,.12)}
.d-av{flex:none;display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--nav2),var(--nav3));
  color:#fff;font-family:var(--ff-d);font-size:1.5rem;font-weight:700}
.d-stuinfo{flex:1 1 180px;min-width:0;display:flex;flex-direction:column}
.d-stuinfo b{font-family:var(--ff-d);font-size:1.3rem}
.d-stuinfo span{color:var(--muted);font-size:.9rem}
.d-stunow{display:flex;flex-direction:column;padding:8px 16px;border-radius:14px;background:var(--shade);border:1px solid var(--line)}
.d-stunow>span:first-child{font-size:.78rem;color:var(--muted);font-weight:700}
.d-stunow b{font-family:var(--ff-d);font-size:1.15rem}
.d-stunow b i{font-style:normal;color:#B45309;font-size:.8rem;letter-spacing:1px}
.d-stunow .num{font-size:.85rem;color:var(--muted)}
.d-h{margin:28px 0 12px;font-size:1.2rem;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.d-h span{font-family:var(--ff-b);font-size:.86rem;font-weight:500;color:var(--muted)}
.d-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.d-tile{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:200px;padding:18px;
  border-radius:18px;border:1px solid var(--line);background:var(--card);text-align:right;font-family:var(--ff-b);cursor:pointer;
  transition:transform .18s,box-shadow .18s,border-color .18s}
.d-tile::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--c)}
.d-tile:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(11,37,69,.13);border-color:var(--c)}
.d-tile:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.d-tic{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:var(--cb);font-size:1.5rem}
.d-tt{font-family:var(--ff-d);font-size:1.22rem}
.d-td{font-size:.9rem;color:var(--muted);line-height:1.7;flex:1 1 auto}
.d-tbar{display:block;width:100%;height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.d-tbar>i{display:block;height:100%;border-radius:99px;background:var(--c,var(--nav2));transition:width .5s ease}
.d-tm{font-size:.86rem;font-weight:700;color:var(--ink)}
.d-tcta{font-weight:700;color:var(--c);font-size:.94rem}
.d-ladder{display:flex;flex-direction:column;gap:10px}
.d-rung{display:flex;flex-direction:column;gap:9px;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--card);--c:var(--nav2)}
.d-rung.cur{border:2px solid var(--nav2);box-shadow:0 6px 18px rgba(11,37,69,.08)}
.d-rung.lk{background:var(--shade);opacity:.8}
.d-rung.lk .d-tbar>i{background:var(--muted)}
.d-rhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.d-rhead b{font-family:var(--ff-d);font-size:1.15rem}
.d-ra{color:var(--muted);font-size:.9rem}
.d-tag{margin-inline-start:auto;padding:2px 11px;border-radius:99px;font-size:.78rem;font-weight:700;background:var(--shade);border:1px solid var(--line);color:var(--muted)}
.d-tag.ok{background:var(--okb);border-color:var(--ok);color:var(--ok)}
.d-tag.cur{background:var(--nav2);border-color:var(--nav2);color:#fff}
.d-tag.lk{background:var(--track);color:var(--muted)}
.d-rfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;font-size:.88rem;color:var(--muted)}
.d-tfoot{margin:26px 0 0;text-align:center}
.d-toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));z-index:60;max-width:min(560px,calc(100vw - 32px));
  transform:translate(-50%,calc(-100% - 40px));padding:12px 18px;border-radius:14px;background:var(--nav1);color:#fff;font-weight:700;font-size:.95rem;line-height:1.7;
  box-shadow:0 10px 30px rgba(0,0,0,.28);transition:transform .3s cubic-bezier(.3,1,.4,1);pointer-events:none;text-align:center}
.d-toast.on{transform:translate(-50%,0)}

/* شريط الواجهات الداخلية */
.d-appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--nav2);color:#fff;box-shadow:0 4px 18px rgba(0,0,0,.2)}
.d-appbar .d-wrap{display:flex;align-items:center;gap:12px;padding-block:9px;min-height:64px}
.d-apptitle{font-family:var(--ff-d);font-size:1.12rem;flex:1 1 auto;min-width:0}
.d-chip{padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.14);font-size:.84rem;font-weight:700;white-space:nowrap}

/* الشرح */

.x-nav{margin-top:18px}

/* مصادر الدرس */
.r-page{padding-block:20px 34px}

.r-cnt{display:grid;place-items:center;min-width:32px;height:32px;padding:0 8px;border-radius:99px;background:var(--cb);color:var(--c);font-weight:700;font-size:.88rem}
.r-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:12px}
.r-card{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--card);
  transition:transform .16s,box-shadow .16s,border-color .16s}
.r-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(11,37,69,.1);border-color:var(--c)}
.r-card.off{background:var(--shade)}
.r-card.off:hover{transform:none;box-shadow:none;border-color:var(--line)}
.r-ic{display:grid;place-items:center;width:46px;height:46px;border-radius:13px;background:var(--cb);color:var(--c)}
.r-body{flex:1 1 auto}
.r-body h4{margin:0;font-family:var(--ff-d);font-size:1.06rem;line-height:1.5}
.r-body p{margin:4px 0 0;font-size:.9rem;color:var(--muted);line-height:1.75}
.r-host{display:inline-block;margin-top:6px;font-size:.76rem;color:var(--muted);font-family:Arial,sans-serif;word-break:break-all}
.r-open{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 14px;border-radius:12px;background:var(--c);color:#fff;
  font-weight:700;font-size:.92rem;text-decoration:none;transition:filter .15s}
.r-open:hover{filter:brightness(1.1)}
.r-open:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.r-open.off{background:var(--track);color:var(--muted);cursor:default}
.r-empty{margin:12px 0 0;color:var(--muted)}

/* تقرير التقدّم */
.rp-page{padding-block:20px 34px}
.rp-empty{padding:24px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-align:center}
.rp-hero{display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px;padding:20px 22px;border-radius:22px;
  background:linear-gradient(135deg,#0B2545,#13315C 50%,#1B4965);color:#fff}
.rp-big{flex:none;display:flex;align-items:baseline;gap:8px}
.rp-big span{font-size:.85rem;font-weight:700;color:var(--onnav2)}

.rp-score small{font-size:.5em;color:var(--muted)}
.rp-meta{margin:8px 0 0;font-size:.84rem;color:var(--muted)}
.rp-bloom{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--card)}
.rp-brow{display:grid;grid-template-columns:70px 1fr auto;align-items:center;gap:10px;font-weight:700;font-size:.9rem}
.rp-brow>span:first-child{color:var(--c)}
.rp-sw{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.rp-s,.rp-w{padding:12px 16px;border-radius:14px}

.rp-w{background:var(--l3b);border:1px solid var(--l3)}

/* وضع المعلّم */
.t-modal{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-start;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 12px 16px;

.t-ihead>b{flex:1 1 140px;min-width:0;font-family:var(--ff-d)}
.t-ic{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--shade);border:1px solid var(--line);color:var(--nav2)}
.t-iacts{display:flex;gap:6px}
.t-mini{min-width:40px;min-height:40px;padding:4px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-family:var(--ff-b);font-weight:700;cursor:pointer}

.t-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}
.t-grid label{display:flex;flex-direction:column;gap:4px;font-size:.84rem;font-weight:700;color:var(--muted)}

.t-card{margin-top:12px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--bg)}

.t-card p{margin:4px 0 10px;color:var(--muted);font-size:.9rem;line-height:1.75}

.t-msg{margin:0;min-height:1.4em;font-size:.9rem;font-weight:700;color:var(--muted)}

}

next\" id=\"x-next\">التالي ←<\/button>\n    <\/nav>\n  <\/div>\n<\/section>\n\n<section class=\"view\" id=\"v-booklet\" hidden>\n<header class=\"hero\">\n  <div class=\"wrap\">\n    <p class=\"eyebrow\">الدراسات الاجتماعية والتربية الوطنية · الصف السادس · الوحدة الثالثة<\/p>\n    <p class=\"byline\">إعدادُ المعلّم / <b>محمود علّام<\/b> <span>MR. Mahmoud Allam<\/span><\/p>\n    <h1>العالِمُ العربيُّ أحمد زويل<\/h1>\n    <p class=\"lede\">تقويمٌ تفاعليٌّ متمايزٌ على ثلاثةِ مستويات · مبنيٌّ على هرم بلوم · تسليمٌ ثمّ تحقّق<\/p>\n    <p class=\"stuline\" id=\"stuline\" hidden><\/p>\n\n    <div class=\"hcard\">\n      <div class=\"scorebox\">\n        <span class=\"lbl\">الدرجة<\/span>\n        <b class=\"num\" id=\"s40\">0<\/b>\n        <span class=\"of\">/ 40<\/span>\n      <\/div>\n      <div class=\"hmeta\">\n        <div class=\"prog\" role=\"progressbar\" aria-label=\"التقدّم\" aria-valuemin=\"0\" aria-valuemax=\"25\" aria-valuenow=\"0\" id=\"pbar\"><i id=\"pfill\"><\/i><\/div>\n        <p class=\"hline\">\n          <span id=\"tnow\">المستوى الأساسي<\/span>\n          <span class=\"dot\">·<\/span>\n          <span class=\"num\" id=\"pcount\">0 / 25<\/span>\n          <button class=\"tgl\" id=\"snd\" type=\"button\" aria-pressed=\"false\">🔇 الصوت<\/button>\n        <\/p>\n      <\/div>\n    <\/div>\n\n    <blockquote class=\"quote\">\n      كنتُ هادئَ النفسِ بسببِ تفوّقي الدراسيّ طوالَ السنواتِ السابقة، وكنتُ شغوفاً بالماهيّةِ التي تعملُ بها الأشياء.\n      <cite>أحمد زويل<\/cite>\n    <\/blockquote>\n  <\/div>\n<\/header>\n\n<div class=\"topbars\">\n  <nav class=\"tracknav\" aria-label=\"مستويات التمايز\">\n    <div class=\"wrap\"><button class=\"homebtn\" type=\"button\" data-act=\"home\" aria-label=\"العودة إلى لوحة الطالب\">🏠 <span>لوحتي<\/span><\/button><div class=\"tracks\" id=\"tracks\" role=\"tablist\"><\/div><\/div>\n  <\/nav>\n<\/div>\n\n<div class=\"shell\">\n  <nav class=\"secnav\" aria-label=\"أقسام التقويم\">\n    <div class=\"wrap\">\n      <p class= const PASS_SHORT={title:"العالِمُ الذي بدأ من غرفته",
 body:"في قريةِ دمنهور بمصر وُلد أحمد زويل. علّق والداه على بابِ غرفته لافتةً كُتب عليها «الدكتور أحمد»، وكان الطفل قد حوّل غرفته إلى ما يشبه المختبر يجرّب فيه ما يتعلّمه. درس الكيمياء وتفوّق، ثم سافر إلى الولاياتِ المتحدةِ لإكمالِ دراسته. هناك واجه صعوبةَ اللغةِ والثقافة، لكنّه لم يستسلم، وظلّ يبحث حتى اخترع كاميرا ترى حركةَ الذرّات، فنال جائزةَ نوبل في الكيمياء.",
 src:"نصٌّ مُبسَّطٌ من درس «العالِم العربي أحمد زويل»، الدراسات الاجتماعية، الصف السادس."};

  model:"واجه زويل عند وصولِه إلى أمريكا صعوباتِ اللغةِ والثقافةِ ثم غلاءَ الحياة، وبلغت ذروتَها حين وجد نفسَه في كالتيك محاطاً بخمسةِ علماءَ حائزين على نوبل في وظيفتِه نفسِها. هذه الصعوباتُ كانت كافيةً لإنهاءِ مسيرتِه، لكنّه تعامل معها بوصفها تحدّياً لا حكماً، فتحوّلت المنافسةُ إلى دافعٍ للاجتهاد، وتحوّلت الغربةُ إلى تفرّغٍ للبحث. وبإصرارِه وقوّةِ إرادتِه تخطّى الصعوباتِ حتى صار أستاذاً رئيساً لعلمِ الكيمياءِ ثم نال جائزةَ نوبل، فصار الموقفُ الذي كاد يُعيده هو الموقفَ الذي صنع عالميّتَه."}

essay:[
 {l:2,q:"وضّح المقصودَ بـ«اقتصادِ المعرفة»، وبيّن كيف تسهم مدينةُ زويل في تحقيقِه.",
  keys:[{k:"مجتمع مبني على المعرفة",s:["المعرفه","مبني علي المعرفه","اقتصاد المعرفه"]},
        {k:"التفكير النقدي أساس المجتمع",s:["التفكير النقدي","النقدي","نقدي"]},
        {k:"منظومة تعليمية مبنية على التميّز",s:["منظومه تعليميه","التميز","التعليم"]},
        {k:"التفاعل مع المجتمع",s:["التفاعل","المجتمع","خدمه المجتمع"]},
        {k:"مشاركة القاهرة ومصر عالمياً",s:["القاهره","مصر","عالميا","النهضه"]}],
  model:"اقتصادُ المعرفةِ هو أن يقومَ اقتصادُ الدولةِ على إنتاجِ المعرفةِ وتوظيفِها لا على المواردِ الخامِ وحدَها، وكان الهدفُ الأعظمُ لزويل أن تشاركَ القاهرةُ فيه مع العالم. وتسهم مدينةُ زويل في ذلك برسالتِها: بناءُ مجتمعٍ مبنيٍّ على المعرفةِ ومؤسَّسٍ على التفكيرِ النقديّ، من خلالِ توفيرِ منظومةٍ تعليميةٍ مبنيّةٍ على التميّز، والتفاعلِ مع المجتمع. وقد صدر مرسومُ الحكومةِ المصريةِ بتأسيسِها مشروعاً قومياً للنهضةِ العلمية، وافتُتحت في نوفمبر 2011م."},
 {l:4,q:"كيف استطاع أحمد زويل التغلّبَ على الصعوباتِ التي واجهته؟",
  keys:[{k:"صعوبة اللغة والثقافة",s:["اللغه","الثقافه"]},
        {k:"الحياة الأمريكية صعبة ومكلفة",s:["مكلفه","صعبه","غلا","الحياه الامريكيه"]},
        {k:"المنافسة مع خمسة من حائزي نوبل في كالتيك",s:["خمسه","نوبل","كالتيك","منافسه"]},
        {k:"الإصرار والصبر وعدم العودة",s:["الاصرار","الصبر","لم يعد","استطاع تخطي","الاراده"]},
        {k:"التفوّق العلمي حتى أعلى منصب جامعي",s:["استاذا رييسا","اعلي منصب","تدرج","المناصب"]}],
  model:"واجه زويل صعوباتٍ عند وصولِه إلى الولاياتِ المتحدة، أبرزُها اللغةُ والثقافة، ثم صعوبةُ الحياةِ الأمريكيةِ وتكاليفُها حتى فكّر بالعودةِ إلى مصر، ثم المنافسةُ القاسيةُ حين عُيِّن أستاذاً مساعداً في كالتيك ووجد خمسةً من حائزي نوبل في وظيفتِه نفسِها ففكّر بالعودةِ ثانيةً. وقد تغلّب عليها بالإصرارِ وقوّةِ الإرادةِ وعدمِ الاستسلام، وبتحويلِ المنافسةِ إلى دافعٍ للبحثِ والاجتهاد، فتدرّج في المناصبِ العلميةِ حتى صار أستاذاً رئيساً لعلمِ الكيمياء، وهو أعلى منصبٍ علميٍّ جامعيٍّ في أمريكا."}
]};

mcq:[
 {l:3,q:"دولةٌ تملك ثرواتٍ طبيعيةً وتريد الانتقالَ إلى اقتصادِ المعرفة. فأيُّ قرارٍ يحقّق ذلك على منهجِ مدينةِ زويل؟",
  o:["الاستثمارُ في منظومةٍ تعليميةٍ تبني التفكيرَ النقديَّ والبحثَ العلميّ",
     "زيادةُ تصديرِ الموادِّ الخامِ لرفعِ الدخلِ القوميّ",
     "استيرادُ التقنياتِ الجاهزةِ من الدولِ المتقدّمة",
     "رفعُ رواتبِ العاملين في القطاعِ الحكوميّ"],a:0,
  w:"اقتصادُ المعرفةِ يقوم على إنتاجِ المعرفةِ لا استهلاكِها، ورسالةُ مدينةِ زويل نصّت على منظومةٍ تعليميةٍ مبنيّةٍ على التميّزِ والتفكيرِ النقديّ. أمّا استيرادُ التقنياتِ الجاهزةِ فيُبقي الدولةَ مستهلِكةً لا منتِجة."},
 {l:3,q:"مدرسةٌ تريد قياسَ أثرِ نادٍ للبحثِ العلميِّ أنشأته. فأيُّ مؤشّرٍ يقيس رسالةَ مدينةِ زويل فعلاً؟",
  o:["عددُ المشروعاتِ التي انتقل فيها الطلبةُ من السؤالِ إلى التجربة",
     "عددُ الطلبةِ المسجَّلين في النادي",
     "عددُ ساعاتِ اجتماعاتِ النادي أسبوعياً",
     "عددُ الكتبِ العلميةِ المشتراةِ للمكتبة"],a:0,
  w:"الرسالةُ تقوم على التفكيرِ النقديِّ وإنتاجِ المعرفة، فالمؤشّرُ الصادقُ يقيس النِّتاجَ لا الحضور. أمّا التسجيلُ والساعاتُ والكتبُ فمدخلاتٌ قد لا تُنتج تفكيراً."},
 {l:4,q:"أيُّ المواقفِ يكشف بوضوحٍ قوّةَ إرادةِ زويل أكثرَ من غيره؟",
  o:["بقاؤه في كالتيك بعد أن وجد خمسةَ علماءَ حائزين على نوبل في وظيفتِه نفسِها",
     "حصولُه على البكالوريوسِ بامتيازٍ مع مرتبةِ الشرف",
     "تصدّرُه المراكزَ الأولى في التعليمِ الأساسيّ",
     "تقديمُه الشكرَ على وسامِ زايد الثاني"],a:0,
  w:"الإرادةُ تُختبر عند التهديدِ بالانسحابِ لا عند النجاح. وهذا هو الموقفُ الذي فكّر عنده بالعودةِ للمرّةِ الثانيةِ ثم تجاوزه، أمّا التفوّقُ الدراسيُّ فنجاحٌ لم يسبقه خطرُ التوقّف."},
 {l:4,q:"ما العلاقةُ بين تخصّصِ دكتوراةِ زويل وبين اختراعِه الذي نال عنه نوبل؟",
  o:["تخصّصُه في علومِ الليزر أتاح له تقنيةَ الليزرِ السريعِ لمراقبةِ حركةِ الذرّات",
     "لا علاقةَ بينهما؛ فالجائزةُ في الكيمياءِ والدكتوراةُ في الفيزياء",
     "دراستُه الليزرَ صرفته عن الكيمياءِ سنواتٍ طويلة",
     "اعتمد في اختراعِه على علمِ الضوءِ الذي درسه في البكالوريوس"],a:0,
  w:"الليزرُ السريعُ هو الأداةُ التي بُنيت عليها الكاميرا، فالدكتوراةُ مهّدت للاختراعِ مباشرةً. وبحثُ علمِ الضوءِ كان في الماجستيرِ لا البكالوريوس."},
 {l:4,q:"قبل كاميرا زويل كان العلماءُ يرون نتيجةَ التفاعلِ الكيميائيِّ فقط. فما التحوّلُ الجوهريُّ الذي أحدثه اختراعُه؟",
  o:["انتقل العلمُ من رصدِ ما بعدَ التفاعلِ إلى رؤيةِ التفاعلِ وهو يحدث",
     "انتقل العلمُ من دراسةِ الجزيئاتِ إلى دراسةِ الكواكب",
     "أصبح بالإمكانِ إجراءُ التفاعلاتِ بسرعةٍ أكبر",
     "أصبحت التفاعلاتُ الكيميائيةُ أقلَّ خطراً على الباحثين"],a:0,
  w:"الكاميرا لم تُسرِع التفاعلَ بل أسرعت الرؤية، فأتاحت مراقبةَ حركةِ الذرّاتِ داخلَ الجزيئاتِ في أثناءِ التفاعلِ نفسِه، وهذا هو ميلادُ كيمياء الفمتوثانية."},
 {l:4,q:"ما العلاقةُ بين قولِ زويل «كنتُ شغوفاً بالماهيّةِ التي تعملُ بها الأشياء» وبين اختراعِه؟",
  o:["سؤالُه الأوّلُ كان «كيف يحدث؟» لا «ماذا يحدث؟»، وهو ما أجابت عنه كاميرا الفمتوثانية",
     "كان شغفُه بالأدواتِ المنزليةِ فصنع منها كاميرا",
     "دفعه شغفُه إلى تركِ الكيمياءِ والاتّجاهِ إلى الهندسة",
     "لا علاقةَ بين عبارتِه الطفوليةِ وبين عملِه العلميّ"],a:0,
  w:"العبارةُ تكشف نوعَ سؤالِه: سؤالَ الآلية. ومن هذا السؤالِ وُلدت فكرةُ رصدِ التفاعلِ في أثناءِ حدوثِه، فتحوّل شغفٌ طفوليٌّ إلى علمٍ جديد."},
 {l:5,q:"أيُّ المعايير أصدقُ في الحكمِ على عظمةِ أثرِ زويل كما يعرضه الدرس؟",
  o:["أنّه أسّس علماً جديداً وأنشأ صرحاً يخدم وطنَه معاً",
     "أنّه حصل على مبلغٍ ماليٍّ كبيرٍ مع الجائزة",
     "أنّه عاش في أمريكا وعمل في جامعةٍ مشهورة",
     "أنّه ألّف عدداً كبيراً من الكتبِ العلمية"],a:0,
  w:"الدرسُ يعرض وجهين لأثرِه: إنجازٌ معرفيٌّ غيّر طريقةَ دراسةِ المادّة، وأثرٌ وطنيٌّ تمثّل في مدينةِ زويل والوصيّةِ بالدفنِ في مصر. أمّا المالُ والشهرةُ والكتبُ فنتائجُ لا معاييرُ للعظمة."},
 {l:5,q:"لو أردتَ تقويمَ تجربةِ زويل لتقديمِها نموذجاً لطلبةِ الإمارات، فأيُّ الدروسِ أجدرُ بالتقديم؟",
  o:["أنّ الإصرارَ أمام الصعوباتِ هو ما يحوّل التفوّقَ الدراسيَّ إلى إنجازٍ عالميّ",
     "أنّ السفرَ إلى الخارجِ شرطٌ لازمٌ للنجاحِ العلميّ",
     "أنّ الجوائزَ العالميةَ هي الهدفُ الأوّلُ لكلِّ عالِم",
     "أنّ العالِمَ يجب أن يتفرّغ للبحثِ ويبتعدَ عن قضايا وطنِه"],a:0,
  w:"التفوّقُ وحده لم يكن كافياً؛ فقد واجه زويل ما يكفي لإنهاءِ مسيرتِه مرّتين. أمّا السفرُ فوسيلةٌ لا شرط، والجائزةُ نتيجةٌ لا هدف، والدرسُ يُبرز صلتَه بوطنِه لا انفصالَه عنه."}
],

text:[
 {l:4,q:"حلّل كيف أسهمت الصعوباتُ التي واجهها زويل في صناعةِ نجاحِه بدل أن تُنهيَه.",

  model:"واجه زويل عند وصولِه إلى أمريكا صعوباتِ اللغةِ والثقافةِ ثم غلاءَ الحياة، وبلغت ذروتَها حين وجد نفسَه في كالتيك محاطاً بخمسةِ علماءَ حائزين على نوبل في وظيفتِه نفسِها. هذه الصعوباتُ كانت كافيةً لإنهاءِ مسيرتِه، لكنّه تعامل معها بوصفِها تحدّياً لا حكماً، فتحوّلت المنافسةُ إلى دافعٍ للاجتهاد، وتحوّلت الغربةُ إلى تفرّغٍ للبحث. وبإصرارِه تخطّى الصعوباتِ حتى صار أستاذاً رئيساً لعلمِ الكيمياءِ ثم نال جائزةَ نوبل، فصار الموقفُ الذي كاد يُعيده هو الموقفَ الذي صنع عالميّتَه."},
 {l:4,q:"يقول النصُّ إنّ كاميرا زويل «فتحت للعالمِ زمناً جديداً». حلّل المقصودَ بهذه العبارة.",
  keys:[{k:"الكاميرا تعمل بسرعة الفمتوثانية",s:["الفمتوثانيه","سرعه","كاميرا","الطيف"]},
        {k:"مراقبة حركة الذرّات داخل الجزيئات",s:["الذرات","الجزييات","حركه","مراقبه"]},

        {k:"ميلاد علم جديد غيّر طريقة دراسة المادة",s:["علم جديد","كيميا الفمتوثانيه","اسس","غير"]}],
  model:"المقصودُ أنّ الكاميرا نقلت العلمَ إلى مقياسٍ زمنيٍّ لم يكن مرئياً من قبل: فهي تعمل بسرعةِ الفمتوثانيةِ وتحلّل الطيف، فتتيح مراقبةَ حركةِ الذرّاتِ داخلَ الجزيئاتِ في أثناءِ التفاعلِ الكيميائيِّ نفسِه عن طريقِ تقنيةِ الليزرِ السريع. قبل ذلك كان العلماءُ يرون نتيجةَ التفاعلِ فقط، أمّا بعدها فصاروا يرونه وهو يحدث. ولهذا أسّس زويل علماً جديداً سُمِّي كيمياء الفمتوثانية، ونال عنه جائزةَ نوبل في الكيمياء."},
 {l:5,q:"أيُّ الإنجازين أبقى أثراً في رأيك: كاميرا الفمتوثانية أم مدينةُ زويل؟ احكم مع تبريرٍ بدليلين من الدرس.",
  keys:[{k:"حكم واضح يختار أحد الإنجازين",s:["اري","برايي","اختار","الاكثر","ابقي"]},
        {k:"دليل من أثر الكاميرا العالمي",s:["كاميرا","الفمتوثانيه","نوبل","علم جديد","الذرات"]},
        {k:"دليل من أثر المدينة الوطني",s:["مدينه زويل","النهضه","اقتصاد المعرفه","مصر","التعليم"]},

        {k:"إشارة إلى استمرار الأثر بعد وفاته",s:["بعد وفاته","مستمر","الاجيال","يستمر","باق"]}],
  model:"نموذجٌ للحكم (وقد تختلف إجابتُك وتبقى صحيحةً إن قوي تبريرُها): الأبقى أثراً في رأيي مدينةُ زويل. فالكاميرا إنجازٌ علميٌّ عظيمٌ أسّس كيمياء الفمتوثانيةَ ونال عنه نوبل، وغيّر طريقةَ دراسةِ التفاعلاتِ في العالم، لكنّه إنجازٌ فرديٌّ اكتمل في حياتِه. أمّا المدينةُ فمؤسّسةٌ تُخرِج باحثين بعد وفاتِه، ورسالتُها بناءُ مجتمعٍ مبنيٍّ على المعرفةِ والتفكيرِ النقديّ، فهي تصنع عشراتِ العلماءِ لا اكتشافاً واحداً. ومن رأى غيرَ ذلك فله حجّةٌ قوية: فبغيرِ الكاميرا ما كان لزويل اسمٌ تُبنى به مدينة."}

essay:[
 {l:5,q:"ما السماتُ التي أعجبتك في شخصيةِ أحمد زويل؟ اذكر ثلاثاً منها مع دليلٍ من الدرسِ على كلِّ سمة، وأيُّها أجدرُ بأن يقتديَ بها طالبٌ مثلك؟ ولماذا؟",

  model:"من أبرزِ سماتِه الشغفُ بالمعرفة، ودليلُه أنّه صنع في غرفتِه ما يشبه المختبرَ وقال إنّه كان شغوفاً بالماهيّةِ التي تعملُ بها الأشياء. ومنها الإصرارُ وعدمُ الاستسلام، ودليلُه أنّه فكّر بالعودةِ إلى مصرَ مرّتين ثم بقي حتى صار أستاذاً رئيساً لعلمِ الكيمياء. ومنها الانتماءُ للوطن، ودليلُه سعيُه لتأسيسِ مدينةِ زويل لخدمةِ نهضةِ مصرَ ووصيّتُه بأن يُدفن فيها. وأجدرُها بالاقتداءِ في رأيي الإصرار، لأنّ الشغفَ والتفوّقَ لا يثبتان أمام أوّلِ عقبةٍ من دونِه، ولأنّ ما صنع عالميّةَ زويل ليس غيابَ الصعوباتِ بل قرارَه ألّا يعود."},
 {l:6,q:"تخيّل أنّك مسؤولٌ عن مبادرةٍ مدرسيةٍ مستوحاةٍ من رسالةِ مدينةِ زويل. صمّم المبادرة: اسمُها، وهدفُها، وثلاثةُ أنشطةٍ فيها، وكيف تقيس نجاحَها.",
  keys:[{k:"اسم مقترح للمبادرة",s:["اسم","اسمها","مبادره","مشروع"]},
        {k:"هدف مرتبط بالمعرفة والتفكير النقدي",s:["هدف","التفكير النقدي","المعرفه","البحث العلمي"]},
        {k:"ثلاثة أنشطة عملية واضحة",s:["نشاط","انشطه","ورشه","تجارب","معرض","نادي"]},
        {k:"التفاعل مع المجتمع المحلي",s:["المجتمع","اوليا الامور","الحي","خدمه"]},
        {k:"مؤشّرات لقياس النجاح",s:["قياس","موشر","استبانه","عدد المشاركين","نتايج"]}],
  model:"نموذجٌ للإجابة (وإجابتُك قد تختلف وتبقى صحيحةً ما دامت متكاملة): المبادرةُ باسمِ «فمتو» لأنّ الفمتوثانيةَ رمزُ النظرِ إلى ما لا يُرى. هدفُها بناءُ مجتمعٍ مدرسيٍّ يفكّر تفكيراً نقدياً ويُنتج معرفةً لا يحفظُها فقط، وهو ما نصّت عليه رسالةُ مدينةِ زويل. أنشطتُها ثلاثة: نادٍ أسبوعيٌّ يحوّل كلَّ درسٍ إلى سؤالٍ قابلٍ للتجريب؛ ومعملٌ مصغّرٌ يصنع فيه كلُّ طالبٍ تجربةً بسيطةً بأدواتٍ متاحةٍ كما صنع زويل مختبرَه في غرفته؛ ومعرضٌ فصليٌّ يُفتح لأولياءِ الأمورِ وأهلِ الحيِّ تحقيقاً للتفاعلِ مع المجتمع. ويُقاس نجاحُها بعددِ المشروعاتِ المكتملة، وبنسبةِ الطلبةِ الذين انتقلوا من السؤالِ إلى التجربة، وباستبانةٍ قبليةٍ وبعديةٍ تقيس مهاراتِ التفكيرِ النقديّ."}
]};

/* الأرقام تُعرض لاتينية (0-9) لأنّها الأوضح للطلبة */
function ar(n){return String(n)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function norm(s){return (s||"")
  .replace(/[ً-ْٰـ]/g,"")
  .replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه")
  .replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/ء/g,"")
  .replace(/[^ء-ي0-9a-zA-Z\s]/g," ").replace(/\s+/g," ").trim();}
function words(s){var n=norm(s);return n?n.split(" ").length:0}

/* ---------- الحالة ---------- */
function shuf(n){var a=[],i,j,x;for(i=0;i<n;i++)a.push(i);
  for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));x=a[i];a[i]=a[j];a[j]=x}return a}
function okPerm(p,b){
  if(!Array.isArray(p)||!b||p.length!==b.length)return false;
  return p.every(function(a,i){
    if(!Array.isArray(a)||a.length!==b[i].o.length)return false;
    return a.slice().sort(function(x,y){return x-y}).every(function(v,k){return v===k});});
}
function initTrack(tk){
  var T=TRACKS[tk];
  S[tk]={}; BADGE[tk]={};
  SDEF.forEach(function(s){
    S[tk][s.k]=T[s.k].map(function(q){
      if(s.k==="sort")return {sel:{},sub:0,ver:0,pts:0,ms:0,lvl:q.l};
      if(s.k==="text"||s.k==="essay")return {val:"",sub:0,ver:0,pts:0,ms:0,lvl:q.l};
      return {sel:null,sub:0,ver:0,pts:0,ms:0,lvl:q.l};});
  });
  PERM[tk]=T.mcq.map(function(q){return shuf(q.o.length)});
  PERMI[tk]=T.img.map(function(q){return shuf(q.o.length)});
}
function initState(){ S={};BADGE={};AI={};PERM={};PERMI={}; TORDER.forEach(initTrack); }
var KEY="zewail-quiz-v2";
function save(){try{localStorage.setItem(KEY,JSON.stringify({A:ACTIVE,S:S,B:BADGE,snd:SND,P:PERM,PI:PERMI}))}catch(e){}}
function load(){try{
  var r=localStorage.getItem(KEY); if(!r)return; var d=JSON.parse(r); if(!d)return;
  if(d.A&&TRACKS[d.A])ACTIVE=d.A;
  if(typeof d.snd==="boolean")SND=d.snd;
  TORDER.forEach(function(tk){
    if(d.P&&okPerm(d.P[tk],TRACKS[tk].mcq))PERM[tk]=d.P[tk];
    if(d.PI&&okPerm(d.PI[tk],TRACKS[tk].img))PERMI[tk]=d.PI[tk];
    if(d.B&&d.B[tk])BADGE[tk]=d.B[tk];
    if(!d.S||!d.S[tk])return;
    SDEF.forEach(function(s){
      var a=d.S[tk][s.k]; if(!Array.isArray(a))return;
      a.forEach(function(v,i){
        var st=S[tk][s.k][i]; if(!st||!v||typeof v!=="object")return;
        st.sub=v.sub?1:0; st.ver=v.ver?1:0; st.pts=+v.pts||0; st.ms=Math.max(0,+v.ms||0);
        if("sel" in v)st.sel=v.sel; if("val" in v)st.val=String(v.val||"");});
    });
  });
}catch(e){}}

function optsHTML(t,i,q,perm){

function lvlRange(k){

}

function gradeText(ans,keys){
 var n=norm(ans),w=words(ans);
 var hits=keys.map(function(k){
   var forms=[norm(k.k)].concat(k.s||[]);
   return forms.some(function(f){f=String(f).trim();return f.length>2&&n.indexOf(f)>=0});});
 var hc=hits.filter(Boolean).length, score=Math.round(hc/keys.length*10);
 if(w<8)score=Math.min(score,4); else if(w<15)score=Math.min(score,7);
 if(score>=10&&(hc<keys.length||w<15))score=9;
 return {score:score,hits:hits,hc:hc,w:w};
}

 return '<svg class="donut" width="54" height="54" viewBox="0 0 54 54" role="img" aria-label="الدرجة '+sc+' من 10">'+
  '<circle cx="27" cy="27" r="'+r+'" fill="none" stroke="var(--track)" stroke-width="6"></circle>'+
  '<circle cx="27" cy="27" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+v.toFixed(1)+' '+(c-v).toFixed(1)+'" transform="rotate(-90 27 27)"></circle>'+
  '<text x="27" y="32" text-anchor="middle">'+ar(sc)+'</text></svg>';
}

var ACTX=null;
function beep(ok){
 if(!SND)return; if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 try{ ACTX=ACTX||new (window.AudioContext||window.webkitAudioContext)();
  var o=ACTX.createOscillator(),g=ACTX.createGain();
  o.type="sine"; o.frequency.value=ok?660:300;
  g.gain.setValueAtTime(.0001,ACTX.currentTime);
  g.gain.exponentialRampToValueAtTime(.12,ACTX.currentTime+.02);
  g.gain.exponentialRampToValueAtTime(.0001,ACTX.currentTime+.18);
  o.connect(g);g.connect(ACTX.destination);o.start();o.stop(ACTX.currentTime+.19);
 }catch(e){}
}
function confetti(){
 if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 var cv=document.getElementById("cf"); if(!cv||!cv.getContext)return;
 var ctx=cv.getContext("2d"); if(!ctx)return;
 cv.width=innerWidth;cv.height=innerHeight;
 var cols=["#0E7490","#047857","#B45309","#6D28D9","#BE123C","#1D4ED8","#FDE68A"],P=[];
 for(var i=0;i<60;i++)P.push({x:Math.random()*cv.width,y:-20-Math.random()*120,
   vx:(Math.random()-.5)*3,vy:2+Math.random()*3.4,r:Math.random()*Math.PI,
   vr:(Math.random()-.5)*.35,s:5+Math.random()*6,c:cols[i%cols.length]});
 var t0=performance.now();
 (function loop(t){
   ctx.clearRect(0,0,cv.width,cv.height);
   P.forEach(function(p){p.vy+=.055;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
     ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;
     ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore();});
   if(t-t0<1600)requestAnimationFrame(loop); else ctx.clearRect(0,0,cv.width,cv.height);
 })(t0);
}

}

   var b=S[tk][s.k][i].ms||0;

var RESDOC={v:0,pin:"",items:[]}, RES_IS_LOCAL=false;
function clone(o){return JSON.parse(JSON.stringify(o))}
function safeUrl(u){
 u=String(u==null?"":u).trim(); if(!u)return "";
 if(/^\/\//.test(u))u="https:"+u;
 else if(!/^[a-z][a-z0-9+.-]*:/i.test(u)&&/^[^\s\/]+\.[a-z]{2,}([\/?#:].*)?$/i.test(u))u="https://"+u;
 if(!/^https?:\/\/[^\s<>"'`\\]+$/i.test(u))return null;
 try{ if(typeof URL==="function"){var x=new URL(u); if(x.protocol!=="http:"&&x.protocol!=="https:")return null; if(!x.hostname||x.hostname.indexOf(".")<0)return null;} }catch(e){return null}
 return u.length>2000?null:u;
}
function hostOf(u){var m=/^https?:\/\/([^\/?#:]+)/i.exec(u||"");return m?m[1].replace(/^www\./i,""):""}
function catIds(){return RES_CATS.map(function(c){return c.id})}
function sanitizeItem(r,i){
 if(!r||typeof r!=="object")return null;
 var u=safeUrl(r.url);
 return {id:/^[A-Za-z0-9_-]{1,24}$/.test(String(r.id||""))?String(r.id):"x"+i,
   cat:catIds().indexOf(r.cat)>=0?r.cat:RES_CATS[0].id,
   ic:ICONS[r.ic]?r.ic:"link",
   name:String(r.name||"").slice(0,120), desc:String(r.desc||"").slice(0,300), url:u||""};
}
function sanitizeDoc(d){
 if(!d||typeof d!=="object"||!Array.isArray(d.items))return null;
 var seen={}, items=[];
 d.items.slice(0,120).forEach(function(r,i){var x=sanitizeItem(r,i); if(!x)return; while(seen[x.id])x.id+="_"; seen[x.id]=1; items.push(x);});
 return {v:Math.max(0,+d.v||0), pin:/^[0-9a-f]{1,16}$/.test(String(d.pin||""))?String(d.pin):"", items:items};
}

   '<button class="t-mini" type="button" data-act="t-down" data-rid="'+esc(r.id)+'" aria-label="نقل لأسفل">↓</button>'+
   '<button class="t-mini del" type="button" data-act="t-del" data-rid="'+esc(r.id)+'">🗑 حذف</button></span></div>'+
  '<div class="t-grid">'+
   '<label>اسم المنصّة<input data-tf="name" data-rid="'+esc(r.id)+'" maxlength="120" value="'+esc(r.name)+'"></label>'+
   '<label>وصفٌ قصير<input data-tf="desc" data-rid="'+esc(r.id)+'" maxlength="300" value="'+esc(r.desc)+'"></label>'+
   '<label class="wide">الرابط <small>(اتركه فارغاً إن لم يتوفّر بعد)</small><input data-tf="url" data-rid="'+esc(r.id)+'" dir="ltr" inputmode="url" placeholder="https://..." value="'+esc(r.url)+'"></label>'+
   '<label>الأيقونة<select data-tf="ic" data-rid="'+esc(r.id)+'">'+Object.keys(ICONS).map(function(k){return opt(k,ICON_NAMES[k]||k,r.ic)}).join("")+'</select></label>'+
   '<label>التصنيف<select data-tf="cat" data-rid="'+esc(r.id)+'">'+RES_CATS.map(function(c){return opt(c.id,c.t,r.cat)}).join("")+'</select></label>'+
  '</div><p class="t-bad" id="tb-'+esc(r.id)+'"'+(bad?'':' hidden')+'>الرابط غير صالح — يجب أن يبدأ بـ https://</p></div>';
}

   RES_CATS.map(function(c){
    var its=DRAFT.filter(function(r){return r.cat===c.id});
    return '<section class="t-cat"><h3>'+esc(c.t)+' <span class="num">('+ar(its.length)+')</span></h3>'+its.map(tItem).join("")+
      '<button class="d-btn ghost2 sm" type="button" data-act="t-add" data-cat="'+c.id+'">＋ إضافة رابط هنا</button></section>';}).join("")+
   '<p class="t-reset"><button class="d-link" type="button" data-act="t-defaults" id="t-defbtn">↺ استعادة القائمة الأصلية</button></p>');
 }else{
  var reg=registered();
  setHTML("t-dev",
   '<div class="t-card"><b>الطالب على هذا الجهاز</b><p>'+(reg?(esc(STU.name)+' · الصف '+esc(STU.cls)+' · بدأ بمستوى '+esc(TRACKS[STU.start].name)+' · الحالي '+esc(TRACKS[currentLevel()].name)):'لا يوجد طالبٌ مسجّل.')+'</p></div>'+
   '<div class="t-card"><b>فتح جميع المستويات على هذا الجهاز</b><p>للمراجعة أو للعرض أمام الصف. يبقى الطالب على الأجهزة الأخرى مقيّداً بسُلّم المستويات.</p>'+
     '<button class="d-btn sm'+(STU.prev?"":" ghost2")+'" type="button" data-act="t-prev" aria-pressed="'+(STU.prev?"true":"false")+'">'+(STU.prev?"🔓 مفتوحة — اضغط للإغلاق":"🔒 مقيّدة — اضغط للفتح")+'</button></div>'+
   '<div class="t-card"><b>إعادة اختيار المستوى</b><p>يعيد الطالب إلى خطوة اختيار المستوى مع الاحتفاظ بإجاباته.</p>'+
     '<button class="d-btn sm ghost2" type="button" data-act="t-relevel" id="t-relevel">↺ إعادة اختيار المستوى</button></div>'+
   '<div class="t-card warn"><b>مسح كل بيانات هذا الجهاز</b><p>يحذف اسم الطالب وإجاباته في المستويات الثلاثة من هذا الجهاز. لا يمكن التراجع.</p>'+
     '<button class="d-btn sm danger" type="button" data-act="t-wipe" id="t-wipe">🗑 مسح بيانات الجهاز</button></div>'+
   '<div class="t-card"><b>تغيير رمز المعلّم</b><p>يُحفظ الرمز الجديد مع «حفظ ونشر التعديلات».</p>'+
     '<div class="t-pinrow"><input id="t-newpin" type="password" inputmode="numeric" maxlength="12" placeholder="رمز جديد (4 أرقام أو أكثر)" autocomplete="new-password">'+
     '<button class="d-btn sm ghost2" type="button" data-act="t-setpin">اعتماد</button></div></div>');
 }
}
function findD(id){for(var i=0;i<DRAFT.length;i++)if(DRAFT[i].id===id)return i;return -1}
function tField(el){
 var i=findD(el.dataset.rid), f=el.dataset.tf; if(i<0||["name","desc","url","ic","cat"].indexOf(f)<0)return;
 var v=String(el.value||"");
 if(f==="ic"&&!ICONS[v])return; if(f==="cat"&&catIds().indexOf(v)<0)return;
 DRAFT[i][f]=v; tMsg("لديك تعديلاتٌ غير منشورة.","warn");
 if(f==="url"){var b=document.getElementById("tb-"+DRAFT[i].id); if(b)b.hidden=!(v.trim()&&safeUrl(v)===null);}
 if(f==="ic"||f==="cat")tRender();
}
function tMove(id,d){
 var i=findD(id); if(i<0)return; var c=DRAFT[i].cat, j=i+d;
 while(j>=0&&j<DRAFT.length&&DRAFT[j].cat!==c)j+=d;
 if(j<0||j>=DRAFT.length)return;
 var x=DRAFT[i]; DRAFT[i]=DRAFT[j]; DRAFT[j]=x; tRender(); tMsg("لديك تعديلاتٌ غير منشورة.","warn");
}
function arm(b,txt){ if(b.dataset.armed==="1")return true; b.dataset.armed="1"; b.textContent=txt; if(b.classList)b.classList.add("armed"); return false; }
function tDel(b){ if(!arm(b,"تأكيد الحذف؟"))return; var i=findD(b.dataset.rid); if(i>=0)DRAFT.splice(i,1); tRender(); tMsg("حُذف الرابط من المسودّة — اضغط «حفظ ونشر» لاعتماده.","warn"); }
function tAdd(cat){
 if(catIds().indexOf(cat)<0)return;
 var c=RES_CATS.filter(function(x){return x.id===cat})[0], id="n"+(Date.now?Date.now():DRAFT.length).toString(36)+DRAFT.length;
 var last=-1; DRAFT.forEach(function(r,i){if(r.cat===cat)last=i});
 DRAFT.splice(last<0?DRAFT.length:last+1,0,{id:id,cat:cat,ic:c.ic,name:"",desc:"",url:""});
 tRender(); var el=document.querySelector('#ti-'+id+' input'); if(el&&el.focus)try{el.focus()}catch(e){}
 tMsg("أُضيف رابطٌ جديد — اكتب اسمه ورابطه ثم اضغط «حفظ ونشر».","warn");
}
function tValidate(){
 var bad=[];
 DRAFT.forEach(function(r){ r.name=String(r.name||"").trim(); r.desc=String(r.desc||"").trim(); r.url=String(r.url||"").trim();
   if(!r.name)bad.push("رابطٌ بلا اسم في «"+RES_CATS.filter(function(c){return c.id===r.cat})[0].t+"»");
   else if(r.url&&safeUrl(r.url)===null)bad.push("رابط «"+r.name+"» غير صالح");
   else if(r.url)r.url=safeUrl(r.url); });
 return bad;
}
function jsonForScript(o){return JSON.stringify(o).replace(/</g,"\\u003c").replace(/\u2028/g,"\\u2028").replace(/\u2029/g,"\\u2029")}
function appCss(){var e=document.getElementById("appcss");return e?String(e.textContent||""):""}
function pageBody(doc){
 return '\n<title>'+PAGE_TITLE+'</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+
  '<style id="appcss">'+appCss()+'</style>\n<div id="app"></div>\n'+
  '<script type="application/json" id="resdata">'+jsonForScript(doc)+'</'+'script>\n'+
  '<script>'+SRC_SCRIPT+'</'+'script>\n';
}
function fullDoc(doc){return SKEL_HEAD+pageBody(doc)+'</body></html>'}
function canRebuild(){return SRC_SCRIPT.length>5000&&appCss().length>2000&&SRC_SCRIPT.indexOf("</"+"script")<0}
function saveLocal(doc){try{localStorage.setItem(RES_LOCAL,JSON.stringify(doc));return true}catch(e){return false}}
var PUBBUSY=false;
async function teacherSave(){
 if(PUBBUSY)return;
 var bad=tValidate();
 if(bad.length){tMsg("لم يُحفظ: "+bad.join("، ")+".","bad"); tRender(); return;}
 var doc=sanitizeDoc({v:Date.now?Date.now():1,pin:NEWPIN||RESDOC.pin,items:DRAFT});
 if(!doc){tMsg("تعذّر تجهيز البيانات.","bad");return}
 RESDOC=doc; DRAFT=clone(doc.items); renderRes();
 var art=null;
 PUBBUSY=true; var sb=document.getElementById("t-savebtn"); if(sb)sb.disabled=true;
 tMsg("جارٍ النشر…","");
 try{ if(canRebuild()&&window.claude&&typeof claude.use==="function")art=await claude.use("artifact"); }catch(e){art=null}
 if(art&&typeof art.publish==="function"){
   try{ sessionStorage.setItem(RES_DRAFT,JSON.stringify(doc.items)); }catch(e){}
   try{
     await art.publish(fullDoc(doc));
     try{sessionStorage.removeItem(RES_DRAFT); localStorage.removeItem(RES_LOCAL);}catch(e){}
     tMsg("✓ نُشرت التعديلات لجميع الطلاب — ستُعاد تحميل الصفحة الآن.","ok");
     PUBBUSY=false; return;
   }catch(e){
     var code=e&&e.code||"";
     if(code==="conflict"){ tMsg("نُشرت نسخةٌ أحدث قبل قليل؛ ستُعاد تحميل الصفحة وتُستعاد مسودّتك عند فتح وضع المعلّم.","warn"); PUBBUSY=false; return; }
     try{sessionStorage.removeItem(RES_DRAFT)}catch(e2){}
   }
 }
 RES_IS_LOCAL=saveLocal(doc); renderRes();
 tMsg(RES_IS_LOCAL?"حُفظت التعديلات على هذا الجهاز فقط — لنشرها لجميع الطلاب افتح الصفحة من حساب صاحبها في Claude ثم احفظ مجدداً.":"تعذّر الحفظ على هذا الجهاز.","warn");
 PUBBUSY=false; if(sb)sb.disabled=false;
}
function wipeDevice(){
 try{localStorage.removeItem(STU_KEY); localStorage.removeItem(KEY);}catch(e){}
 tStop(); TCUR=null; STU=stuDef(); initState(); ACTIVE="map"; render(); paintAll(); refresh(); LASTSET=[];
}

/* ---------- الأحداث ---------- */
document.addEventListener("click",function(e){
 var b=e.target&&e.target.closest?e.target.closest("[data-act]"):null; if(!b)return;
 var a=b.dataset.act;
 if(a==="home"){go("home");return}
 if(a==="nav"){go(b.dataset.v);return}
 if(a==="lvlopen"){var k=b.dataset.k; if(isOpen(k))go("booklet",k); else lockToast(k); return}
 if(a==="d-next1"){onNext1();return}
 if(a==="d-pick"){onPick(b.dataset.k);return}
 if(a==="d-confirm"){onConfirm();return}
 if(a==="d-back1"){onbStep(1);return}
 if(a==="d-edit"){show_("d-dash",false);show_("d-onb",true);onbStep(1);
   var nm=document.getElementById("d-name"),cl=document.getElementById("d-cls"); if(nm)nm.value=STU.name; if(cl)cl.value=STU.cls; return}
 if(a==="x-prev"){xStep(-1);return}
 if(a==="x-next"){xStep(1);return}
 if(a==="x-go"){var n=+b.dataset.n; xRender(n,n>=XPOS?1:-1); return}
 if(a==="x-reveal"){var an=document.getElementById("x-ans"); if(an){an.hidden=!an.hidden; b.textContent=an.hidden?"اكشف الإجابة المقترحة":"إخفاء الإجابة"; if(b.setAttribute)b.setAttribute("aria-expanded",an.hidden?"false":"true");} return}
 if(a==="rp-copy"){copyText(reportText());return}
 if(a==="rp-print"){try{window.print()}catch(x){}return}
 if(a==="teacher"){tOpen();return}
 if(a==="t-close"){tClose();return}
 if(a==="t-unlock"){tUnlock();return}
 if(!TSESS)return;
 if(a==="t-tab"){tTab(b.dataset.tab);return}
 if(a==="t-up"){tMove(b.dataset.rid,-1);return}
 if(a==="t-down"){tMove(b.dataset.rid,1);return}
 if(a==="t-del"){tDel(b);return}
 if(a==="t-add"){tAdd(b.dataset.cat);return}
 if(a==="t-defaults"){ if(!arm(b,"تأكيد الاستعادة؟ ستُستبدل القائمة الحالية"))return;
   DRAFT=RES_DEFAULT.map(function(r,i){return sanitizeItem(r,i)}); tRender(); tMsg("استُعيدت القائمة الأصلية في المسودّة — اضغط «حفظ ونشر» لاعتمادها.","warn"); return}
 if(a==="t-save"){teacherSave();return}
 if(a==="t-prev"){STU.prev=!STU.prev; stuSave(); LASTSET=openSet(); renderTracks(); refresh(); tRender(); tMsg(STU.prev?"فُتحت جميع المستويات على هذا الجهاز.":"عاد سُلّم المستويات للعمل على هذا الجهاز.","ok"); return}
 if(a==="t-relevel"){ if(!arm(b,"تأكيد؟ سيختار الطالب مستواه من جديد"))return;
   STU.start=""; STU.done={}; stuSave(); LASTSET=[]; tClose(); go("home"); return}
 if(a==="t-wipe"){ if(!arm(b,"تأكيد المسح النهائي؟"))return; wipeDevice(); tClose(); go("home"); toast("مُسحت بيانات هذا الجهاز."); return}
 if(a==="t-setpin"){var np=document.getElementById("t-newpin"), v=String(np&&np.value||"").trim();
   if(!/^\d{4,12}$/.test(v)){tMsg("الرمز يجب أن يكون من 4 إلى 12 رقماً.","bad");return}
   NEWPIN=pinHash(v); if(np)np.value=""; tMsg("اعتُمد الرمز الجديد — اضغط «حفظ ونشر التعديلات» ليسري.","warn"); return}
});
function onField(e){var el=e.target; if(el&&el.dataset&&el.dataset.tf&&TSESS)tField(el);}
document.addEventListener("input",onField);
document.addEventListener("change",onField);
document.addEventListener("submit",function(e){if(e.preventDefault)e.preventDefault(); if(VIEW==="home")onNext1();});
document.addEventListener("keydown",function(e){
 if(!e)return;
 var tg=e.target&&e.target.tagName;
 if(e.key==="Escape"){var m=document.getElementById("t-modal"); if(m&&!m.hidden){tClose();return}}
 if(e.key==="Enter"&&e.target&&e.target.id==="t-pin"){tUnlock();return}
 if(e.key==="Enter"&&e.target&&(e.target.id==="d-name"||e.target.id==="d-cls")){if(e.preventDefault)e.preventDefault(); onNext1(); return}
 if(VIEW!=="explain"||tg==="INPUT"||tg==="TEXTAREA"||tg==="SELECT")return;
 if(e.key==="ArrowLeft")xStep(1); else if(e.key==="ArrowRight")xStep(-1);
});

function appBoot(){
 var root=document.getElementById("app");
 if(root)root.innerHTML=SHELL_HTML;
 stuLoad(); resBoot();
 boot();
 if(registered()&&!isOpen(ACTIVE)){ACTIVE=currentLevel(); AI={}; render(); paintAll(); refresh(); save();}
 LASTSET=openSet();
 go("home");
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",appBoot); else appBoot();
